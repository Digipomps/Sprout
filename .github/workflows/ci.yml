name: CI

on:
  push:
    branches: [ main, "codex/**" ]
  pull_request:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build-test-macos:
    runs-on: macos-latest
    env:
      SPROUT_GPG_PRIVATE_KEY: ${{ secrets.SPROUT_GPG_PRIVATE_KEY }}
      SPROUT_GPG_PASSPHRASE: ${{ secrets.SPROUT_GPG_PASSPHRASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check out pinned Nearby companion source
        uses: actions/checkout@v4
        with:
          repository: Digipomps/CellProtocol
          ref: 533b42d5dc25cf1453cbe5ad08f523d47d5d32e9
          path: .release-dependencies/CellProtocol
          persist-credentials: false

      - name: Set platform artifact names
        run: |
          suffix="macos-$(uname -m)"
          echo "SPROUT_RELEASE_SUFFIX=$suffix" >> "$GITHUB_ENV"
          echo "SPROUT_CHECKSUM_FILE=dist/SHA256SUMS-$suffix.b64url" >> "$GITHUB_ENV"
          echo "SPROUT_SBOM_FILE=dist/sprout-$suffix.spdx.json" >> "$GITHUB_ENV"
          echo "SPROUT_ARTIFACT_SPROUT=dist/sprout-$suffix" >> "$GITHUB_ENV"
          echo "SPROUT_ARTIFACT_UPDATER=dist/sprout-updater-$suffix" >> "$GITHUB_ENV"

      - name: Swift version
        run: swift --version

      - name: Lint (syntax/package sanity)
        run: swift package dump-package > /dev/null

      - name: Build
        run: |
          swift build --product sprout
          swift build --product sprout-updater
          swift build --product sprout-macos

      - name: Test
        run: swift test

      - name: Verify installed nearby companion lookup
        run: python3 Scripts/test_nearby_companion.py .build/debug/sprout
      - name: Terminal and release guard regressions
        run: |
          bash Scripts/test_terminal_onboarding.sh
          bash Scripts/test_release_guards.sh

      - name: Build release bundle
        run: bash Scripts/build_release_bundle.sh dist "$SPROUT_RELEASE_SUFFIX"

      - name: Verify actual packaged Nearby companion
        run: python3 Scripts/test_packaged_nearby.py dist "$SPROUT_RELEASE_SUFFIX"

      - name: Install cosign
        if: ${{ github.event_name != 'pull_request' }}
        uses: sigstore/cosign-installer@v3.7.0

      - name: Keyless sign release bundle
        if: ${{ github.event_name != 'pull_request' }}
        env:
          COSIGN_YES: "true"
        run: bash Scripts/sign_release_bundle.sh dist "$SPROUT_CHECKSUM_FILE"

      - name: Optional GPG signing
        if: ${{ env.SPROUT_GPG_PRIVATE_KEY != '' }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$SPROUT_GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --passphrase "$SPROUT_GPG_PASSPHRASE" \
            --armor --detach-sign --output "${SPROUT_CHECKSUM_FILE}.asc" "$SPROUT_CHECKSUM_FILE"

      - name: Verify release bundle
        env:
          SPROUT_ALLOW_UNSIGNED: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          COSIGN_CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/ci.yml@${{ github.ref }}
        run: bash Scripts/verify_release_bundle.sh dist "" "$SPROUT_CHECKSUM_FILE"

      - name: Attest build provenance
        if: ${{ github.event_name != 'pull_request' && vars.SPROUT_ENABLE_GITHUB_ATTESTATIONS == 'true' }}
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            ${{ env.SPROUT_ARTIFACT_SPROUT }}
            ${{ env.SPROUT_ARTIFACT_UPDATER }}

      - name: Attest SBOM
        if: ${{ github.event_name != 'pull_request' && vars.SPROUT_ENABLE_GITHUB_ATTESTATIONS == 'true' }}
        uses: actions/attest-sbom@v2
        with:
          subject-path: |
            ${{ env.SPROUT_ARTIFACT_SPROUT }}
            ${{ env.SPROUT_ARTIFACT_UPDATER }}
          sbom-path: ${{ env.SPROUT_SBOM_FILE }}

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: sprout-dist-macos
          path: dist/

  build-test-linux:
    runs-on: ubuntu-24.04
    container:
      image: swift:6.2.4-noble@sha256:9bea530093ffff8cf6c259991715ee843fe4d0f932e612f7f4b79cca6e00db87
    env:
      SPROUT_GPG_PRIVATE_KEY: ${{ secrets.SPROUT_GPG_PRIVATE_KEY }}
      SPROUT_GPG_PASSPHRASE: ${{ secrets.SPROUT_GPG_PASSPHRASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install release verification tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 openssl binutils

      - name: Install checksum-pinned static Linux SDK
        run: |
          swift sdk install https://download.swift.org/swift-6.2.4-release/static-sdk/swift-6.2.4-RELEASE/swift-6.2.4-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz --checksum 24bdf84495dd31a6de2eb679647c1982b747bfbfe1a2060c779d84dcecd902a4
          echo 'SPROUT_STATIC_LINUX_SDK=x86_64-swift-linux-musl' >> "$GITHUB_ENV"

      - name: Set platform artifact names
        run: |
          suffix="linux-$(uname -m)"
          echo "SPROUT_RELEASE_SUFFIX=$suffix" >> "$GITHUB_ENV"
          echo "SPROUT_CHECKSUM_FILE=dist/SHA256SUMS-$suffix.b64url" >> "$GITHUB_ENV"
          echo "SPROUT_SBOM_FILE=dist/sprout-$suffix.spdx.json" >> "$GITHUB_ENV"
          echo "SPROUT_ARTIFACT_SPROUT=dist/sprout-$suffix" >> "$GITHUB_ENV"
          echo "SPROUT_ARTIFACT_UPDATER=dist/sprout-updater-$suffix" >> "$GITHUB_ENV"

      - name: Swift version
        run: swift --version

      - name: Lint (syntax/package sanity)
        run: swift package dump-package > /dev/null

      - name: Build
        run: |
          swift build --product sprout
          swift build --product sprout-updater

      - name: Test
        run: swift test

      - name: Terminal and release guard regressions
        run: |
          bash Scripts/test_terminal_onboarding.sh
          bash Scripts/test_release_guards.sh

      - name: Build release bundle
        run: bash Scripts/build_release_bundle.sh dist "$SPROUT_RELEASE_SUFFIX"

      - name: Execute the actual static Linux artifact
        run: |
          "$SPROUT_ARTIFACT_SPROUT" doctor --json
          bash Scripts/test_terminal_onboarding.sh "$SPROUT_ARTIFACT_SPROUT"

      - name: Install cosign
        if: ${{ github.event_name != 'pull_request' }}
        uses: sigstore/cosign-installer@v3.7.0

      - name: Keyless sign release bundle
        if: ${{ github.event_name != 'pull_request' }}
        env:
          COSIGN_YES: "true"
        run: bash Scripts/sign_release_bundle.sh dist "$SPROUT_CHECKSUM_FILE"

      - name: Optional GPG signing
        if: ${{ env.SPROUT_GPG_PRIVATE_KEY != '' }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$SPROUT_GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --passphrase "$SPROUT_GPG_PASSPHRASE" \
            --armor --detach-sign --output "${SPROUT_CHECKSUM_FILE}.asc" "$SPROUT_CHECKSUM_FILE"

      - name: Verify release bundle
        env:
          SPROUT_ALLOW_UNSIGNED: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          COSIGN_CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/ci.yml@${{ github.ref }}
        run: bash Scripts/verify_release_bundle.sh dist "" "$SPROUT_CHECKSUM_FILE"

      - name: Attest build provenance
        if: ${{ github.event_name != 'pull_request' && vars.SPROUT_ENABLE_GITHUB_ATTESTATIONS == 'true' }}
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            ${{ env.SPROUT_ARTIFACT_SPROUT }}
            ${{ env.SPROUT_ARTIFACT_UPDATER }}

      - name: Attest SBOM
        if: ${{ github.event_name != 'pull_request' && vars.SPROUT_ENABLE_GITHUB_ATTESTATIONS == 'true' }}
        uses: actions/attest-sbom@v2
        with:
          subject-path: |
            ${{ env.SPROUT_ARTIFACT_SPROUT }}
            ${{ env.SPROUT_ARTIFACT_UPDATER }}
          sbom-path: ${{ env.SPROUT_SBOM_FILE }}

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: sprout-dist-linux
          path: dist/
