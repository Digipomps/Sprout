name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to release, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
      SPROUT_GPG_PRIVATE_KEY: ${{ secrets.SPROUT_GPG_PRIVATE_KEY }}
      SPROUT_GPG_PASSPHRASE: ${{ secrets.SPROUT_GPG_PASSPHRASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag exists for workflow dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          git tag --force "$RELEASE_TAG" "$GITHUB_SHA"

      - name: Swift version
        run: swift --version

      - name: Build
        run: |
          swift build --product sprout
          swift build --product sprout-updater
          swift build --product sprout-macos

      - name: Test
        run: swift test

      - name: Build release bundle
        run: zsh Scripts/build_release_bundle.sh dist

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Keyless sign release bundle
        env:
          COSIGN_YES: "true"
        run: zsh Scripts/sign_release_bundle.sh dist

      - name: Optional GPG signing
        if: ${{ env.SPROUT_GPG_PRIVATE_KEY != '' }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$SPROUT_GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --passphrase "$SPROUT_GPG_PASSPHRASE" \
            --armor --detach-sign --output dist/SHA256SUMS.b64url.asc dist/SHA256SUMS.b64url

      - name: Verify release bundle
        run: zsh Scripts/verify_release_bundle.sh dist

      - name: Attest build provenance
        if: ${{ vars.SPROUT_ENABLE_GITHUB_ATTESTATIONS == 'true' }}
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/sprout
            dist/sprout-updater

      - name: Attest SBOM
        if: ${{ vars.SPROUT_ENABLE_GITHUB_ATTESTATIONS == 'true' }}
        uses: actions/attest-sbom@v2
        with:
          subject-path: |
            dist/sprout
            dist/sprout-updater
          sbom-path: dist/sprout.spdx.json

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/sprout
            dist/sprout-updater
            dist/SHA256SUMS.b64url
            dist/SHA256SUMS.b64url.asc
            dist/release-manifest.json
            dist/sprout.spdx.json
            dist/sprout.sig
            dist/sprout.pem
            dist/sprout-updater.sig
            dist/sprout-updater.pem
            dist/SHA256SUMS.b64url.sig
            dist/SHA256SUMS.b64url.pem
